name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tap this checkout
        run: brew tap pawantekchandani/tap "$GITHUB_WORKSPACE"
      - name: Audit, install and test
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew audit --strict pawantekchandani/tap/zero-eyes
          brew install pawantekchandani/tap/zero-eyes
          brew test pawantekchandani/tap/zero-eyes
          test -x "$(brew --prefix)/bin/zero-eyes-setup"
